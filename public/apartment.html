<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#173f35" />
    <meta name="description" content="Информация о квартире" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <title>Информация о квартире · MaidAid</title>
  </head>
  <body>
    <header class="hero apartment-page-hero">
      <div class="brand">
        <img src="/icons/icon.svg" alt="" width="48" height="48" />
        <div>
          <p class="eyebrow">Квартира</p>
          <h1>Информация</h1>
        </div>
      </div>
    </header>

    <main>
      <section id="apartment-content" class="panel apartment-page">
        <button id="apartment-back" class="back-button secondary" type="button">← Назад к расписанию</button>
        <h2 id="apartment-name"></h2>
        <p id="apartment-address" class="apartment-page-address" hidden></p>
        <a id="apartment-maps" class="action-link maps-button" hidden>Карты</a>
        <h3>Информация для уборки</h3>
        <pre id="apartment-note" class="apartment-note"></pre>
      </section>

      <section id="apartment-unavailable" class="panel apartment-page" hidden>
        <h2>Информация недоступна</h2>
        <p>Вернитесь к расписанию и снова выберите квартиру.</p>
        <a class="action-link secondary" href="/">Вернуться к расписанию</a>
      </section>
    </main>

    <script type="module" src="/apartment.js"></script>
  </body>
</html>
