name: Verify

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: maidaid_test
          POSTGRES_USER: maidaid
          POSTGRES_PASSWORD: maidaid
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maidaid -d maidaid_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://maidaid:maidaid@127.0.0.1:5432/maidaid_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Build application
        run: npm run build
