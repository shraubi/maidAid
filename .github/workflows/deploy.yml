name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
  workflow_dispatch:

concurrency:
  group: maidaid-deploy
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: shraubi/maidaid
  IMAGE_TAG: latest
  TEST_DATABASE_URL: postgresql://maidaid@127.0.0.1:5432/maidaid_test

jobs:
  deploy:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: maidaid_test
          POSTGRES_USER: maidaid
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maidaid -d maidaid_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Build application
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy prebuilt image to VM
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: REGISTRY,IMAGE_NAME,IMAGE_TAG,GHCR_USER,GHCR_TOKEN
          script: |
            set -eu
            cd "${{ secrets.APP_DIR }}"
            git pull --ff-only origin main
            if ! grep -q '^POSTGRES_PASSWORD=' .env; then
              umask 077
              printf '\nPOSTGRES_PASSWORD=%s\n' "$(openssl rand -hex 24)" >> .env
            fi
            for required in TEAM_ACCESS_CODE NGROK_AUTHTOKEN NGROK_DOMAIN; do
              if ! grep -q "^${required}=." .env; then echo "Missing required .env value: ${required}"; exit 1; fi
            done
            printf '%s' "$GHCR_TOKEN" | docker login "$REGISTRY" --username "$GHCR_USER" --password-stdin
            docker compose pull postgres maidaid ngrok tailscale
            docker compose up -d --no-build postgres maidaid ngrok tailscale
            docker compose ps --status running postgres maidaid ngrok tailscale
            docker compose exec -T maidaid node -e "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
            docker compose exec -T tailscale tailscale status
            for attempt in $(seq 1 12); do
              if docker compose exec -T tailscale tailscale funnel status; then break; fi
              if [ "$attempt" -eq 12 ]; then exit 1; fi
              sleep 5
            done
            SMOKE_SESSION_TOKEN="$(docker compose exec -T maidaid node dist/src/admin.js issue-session)"
            docker compose exec -T -e SMOKE_SESSION_TOKEN="$SMOKE_SESSION_TOKEN" maidaid node --input-type=module -e '
              const base = "http://127.0.0.1:3000";
              const date = "2099-12-30";
              const text = "**30/12/2099**\nКвартира А 3h + 4.20€ сушка + 1.30€ расходы\nКвартира Б 2.5h + 0 + 0\nАванс: 20€";
              let sessionCookie = `maidaid_session=${process.env.SMOKE_SESSION_TOKEN || ""}`;
              const json = async (path, options = {}) => {
                const headers = { ...(options.headers || {}), ...(sessionCookie ? { cookie: sessionCookie } : {}) };
                const response = await fetch(`${base}${path}`, { ...options, headers });
                if (!response.ok) throw new Error(`${path} returned ${response.status}: ${await response.text()}`);
                return response.status === 204 ? null : response.json();
              };
              if (!process.env.SMOKE_SESSION_TOKEN) throw new Error("Smoke-test session was not issued");
              const appResponse = await fetch(`${base}/app.js`);
              if (!appResponse.ok || !appResponse.headers.get("content-type")?.includes("javascript")) throw new Error("Production app.js response is invalid");
              new Function(await appResponse.text());
              const serviceWorkerResponse = await fetch(`${base}/sw.js`);
              if (!serviceWorkerResponse.ok || !serviceWorkerResponse.headers.get("content-type")?.includes("javascript")) throw new Error("Production sw.js response is invalid");
              new Function(await serviceWorkerResponse.text());
              const manifestResponse = await fetch(`${base}/manifest.webmanifest`);
              if (!manifestResponse.ok) throw new Error(`Production manifest returned ${manifestResponse.status}`);
              const manifest = JSON.parse(await manifestResponse.text());
              if (manifest.name !== "MaidAid" || manifest.start_url !== "/") throw new Error("Production manifest content is invalid");
              const appConfig = await json("/api/app-config");
              if (appConfig.productRelease !== 2) throw new Error(`Expected product release 2, got ${appConfig.productRelease}`);
              await json("/api/places");
              const ledgerPath = `/api/ledger?from=${date}&to=${date}`;
              try {
                const before = await json(ledgerPath);
                if (before.rows.length) throw new Error(`Smoke-test date ${date} is already occupied`);
                const preview = await json("/api/preview", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ text }) });
                const [firstJob, secondJob] = preview.parsed.jobs;
                if (!preview.canShare || preview.advanceCents !== 2000 || preview.totals.minutes !== 330 || preview.totals.incomeCents !== 5500 || preview.totals.expensesCents !== 550) throw new Error("Duration preview totals are incorrect");
                if (firstJob?.object !== "Квартира А" || secondJob?.object !== "Квартира Б") throw new Error("Duration job objects were not parsed");
                await json("/api/days", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ text }) });
              const saved = await json(ledgerPath);
                if (saved.rows.length !== 2 || saved.rows[0]?.dateIso !== date || saved.totals.earnedCents !== 5500 || saved.totals.receivedCents !== 2000) throw new Error("Saved ledger state is incorrect");
              } finally {
                try { await json(`/api/days/${date}`, { method: "DELETE" }); }
                catch (error) { if (!String(error).includes("returned 404")) throw error; }
              }
              const after = await json(ledgerPath);
              if (after.rows.length || after.totals.earnedCents || after.totals.receivedCents) throw new Error("Smoke-test cleanup did not remove the test day");
              await json("/api/auth/logout", { method: "POST" });
              console.log("Production duration/date/delete smoke test passed");
            '
            docker image prune -f
            docker logout "$REGISTRY"
