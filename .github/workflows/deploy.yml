name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
  workflow_dispatch:

concurrency:
  group: maidaid-deploy
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: shraubi/maidaid
  IMAGE_TAG: latest

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Build application
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy prebuilt image to VM
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: REGISTRY,IMAGE_NAME,IMAGE_TAG,GHCR_USER,GHCR_TOKEN
          script: |
            set -eu
            cd "${{ secrets.APP_DIR }}"
            git pull --ff-only origin main
            if ! grep -q '^POSTGRES_PASSWORD=' .env; then
              umask 077
              printf '\nPOSTGRES_PASSWORD=%s\n' "$(openssl rand -hex 24)" >> .env
            fi
            printf '%s' "$GHCR_TOKEN" | docker login "$REGISTRY" --username "$GHCR_USER" --password-stdin
            docker compose pull postgres maidaid ngrok
            docker compose up -d --no-build postgres maidaid ngrok
            docker compose ps --status running postgres maidaid ngrok
            docker compose exec -T maidaid node -e "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
            docker compose exec -T maidaid node --input-type=module -e '
              const base = "http://127.0.0.1:3000";
              const date = "2099-12-30";
              const text = "**30/12/2099**\nDominiquet 3h + 4.20€ сушка + 1.30€ расходы\nOpéra 2.5h + 0 + 0\nАванс: 20€";
              const json = async (path, options) => {
                const response = await fetch(`${base}${path}`, options);
                if (!response.ok) throw new Error(`${path} returned ${response.status}: ${await response.text()}`);
                return response.status === 204 ? null : response.json();
              };
              const appResponse = await fetch(`${base}/app.js`);
              if (!appResponse.ok || !appResponse.headers.get("content-type")?.includes("javascript")) throw new Error("Production app.js response is invalid");
              new Function(await appResponse.text());
              const serviceWorkerResponse = await fetch(`${base}/sw.js`);
              if (!serviceWorkerResponse.ok || !serviceWorkerResponse.headers.get("content-type")?.includes("javascript")) throw new Error("Production sw.js response is invalid");
              new Function(await serviceWorkerResponse.text());
              const manifestResponse = await fetch(`${base}/manifest.webmanifest`);
              if (!manifestResponse.ok) throw new Error(`Production manifest returned ${manifestResponse.status}`);
              const manifest = JSON.parse(await manifestResponse.text());
              if (manifest.name !== "MaidAid" || manifest.start_url !== "/") throw new Error("Production manifest content is invalid");
              const ledgerPath = `/api/ledger?from=${date}&to=${date}`;
              try {
                const before = await json(ledgerPath);
                if (before.rows.length) throw new Error(`Smoke-test date ${date} is already occupied`);
                const preview = await json("/api/preview", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ text }) });
                const [dominique, opera] = preview.parsed.jobs;
                if (!preview.canShare || preview.advanceCents !== 2000 || preview.totals.minutes !== 330 || preview.totals.incomeCents !== 5500 || preview.totals.expensesCents !== 550) throw new Error("Duration preview totals are incorrect");
                if (dominique?.object !== "Dominique" || !dominique.apartmentId || opera?.object !== "Opéra" || !opera.apartmentId) throw new Error("Apartment alias was not resolved");
                await json("/api/days", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ text }) });
                const saved = await json(ledgerPath);
                if (saved.rows.length !== 2 || saved.rows[0]?.dateIso !== date || saved.totals.earnedCents !== 5500 || saved.totals.receivedCents !== 2000) throw new Error("Saved ledger state is incorrect");
              } finally {
                const cleanup = await fetch(`${base}/api/days/${date}`, { method: "DELETE" });
                if (![204, 404].includes(cleanup.status)) throw new Error(`Cleanup returned ${cleanup.status}`);
              }
              const after = await json(ledgerPath);
              if (after.rows.length || after.totals.earnedCents || after.totals.receivedCents) throw new Error("Smoke-test cleanup did not remove the test day");
              console.log("Production duration/date/delete smoke test passed");
            '
            docker image prune -f
            docker logout "$REGISTRY"

