services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-maidaid}
      POSTGRES_USER: ${POSTGRES_USER:-maidaid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - maidaid-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  maidaid:
    image: ghcr.io/shraubi/maidaid:latest
    pull_policy: always
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      PRODUCT_RELEASE: ${PRODUCT_RELEASE:-2}
      DATABASE_URL: postgresql://${POSTGRES_USER:-maidaid}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-maidaid}
      APARTMENT_IMPORT_TOKEN: ${APARTMENT_IMPORT_TOKEN:-}
      TEAM_ACCESS_CODE: ${TEAM_ACCESS_CODE:-}
      INITIAL_CLEANER_NAME: ${INITIAL_CLEANER_NAME:-}
      INITIAL_CLEANER_PIN: ${INITIAL_CLEANER_PIN:-}
      SESSION_DAYS: ${SESSION_DAYS:-90}
    volumes:
      - maidaid-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MAIDAID_HOST_PORT:-3001}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  ngrok:
    image: ngrok/ngrok:latest
    pull_policy: always
    restart: unless-stopped
    command:
      - http
      - http://maidaid:3000
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    depends_on:
      maidaid:
        condition: service_healthy

  tailscale:
    image: tailscale/tailscale:stable
    pull_policy: always
    restart: unless-stopped
    network_mode: service:maidaid
    environment:
      TS_AUTHKEY: ${TAILSCALE_AUTHKEY:-}
      TS_AUTH_ONCE: "true"
      TS_EXTRA_ARGS: --hostname=maidaid
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - maidaid-tailscale:/var/lib/tailscale
      - ./tailscale:/config:ro
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    depends_on:
      maidaid:
        condition: service_healthy

volumes:
  maidaid-data:
  maidaid-postgres:
  maidaid-tailscale:
