services:
  maidaid:
    image: ghcr.io/shraubi/maidaid:latest
    pull_policy: always
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_PATH: /data/maidaid.sqlite
    volumes:
      - maidaid-data:/data
    ports:
      - "127.0.0.1:${MAIDAID_HOST_PORT:-3001}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  ngrok:
    image: ngrok/ngrok:latest
    pull_policy: always
    restart: unless-stopped
    command:
      - http
      - --url=${NGROK_DOMAIN}
      - http://maidaid:3000
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    depends_on:
      maidaid:
        condition: service_healthy

volumes:
  maidaid-data:
